name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Audit distributable tree
        # Private paths, identity metadata and personal paths are checked on
        # every push and pull request.  The forbidden-name scan needs a secret
        # that pull requests from forks never receive, so it runs in the
        # private development repository before each release is published.
        run: python scripts/check_distribution.py
